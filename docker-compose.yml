services:
  mongodb:
    image: mongo:8.0
    container_name: failure_replay_lab_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: failure_replay_lab
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: failure_replay_lab_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - MONGODB_URI=mongodb://mongodb:27017/failure_replay_lab
      - DB_NAME=failure_replay_lab
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: failure_replay_lab_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
